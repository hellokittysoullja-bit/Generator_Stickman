<script>
// Все движения — из общей таблицы времени (../timing.js, та же, что у Blender). Кадр f → t = f/30.
const T = window.Timing, $ = id => document.getElementById(id);
const set = (id, a, v) => $(id).setAttribute(a, v);
const LAYERS = ['L_dima', 'L_plaid', 'L_cat'];
function seek(t) {
  const bl = T.dima_blink(t), py = T.pupils(t), th = T.thumb(t), sc = T.screen(t), fl = T.flame(t);
  const tail = T.tail(t), cb = T.cat_blink(t);
  const px = 2.6 * Math.sin(2 * Math.PI * t / 0.9);          // строки читаются слева направо
  for (const nm of ['N', 'F']) {
    set('dima_lid_' + nm, 'transform', `translate(0 ${bl * 58})`);
    set('dima_pupil_' + nm, 'transform', `translate(${px.toFixed(3)} ${(py * 6).toFixed(3)})`);
  }
  // большой палец — за телефоном; свайп читается лёгким движением кисти с телефоном (вверх и поворот) и вспышкой экрана
  set('dima_hand_move', 'transform', `translate(0 ${(-4 * th).toFixed(3)}) rotate(${(-2 * th).toFixed(3)} 60 120)`);
  const so = Math.min(1, 0.62 * sc);
  set('scr_dima', 'opacity', so.toFixed(4)); set('scr_plaid', 'opacity', (so * 0.75).toFixed(4));
  set('scr_cat', 'opacity', Math.min(1, 0.55 * sc).toFixed(4));
  set('fl_cat', 'opacity', Math.min(1, 0.72 * fl).toFixed(4)); set('fl_plaid', 'opacity', Math.min(1, 0.72 * fl).toFixed(4));
  const rot = `rotate(${tail.toFixed(3)} 912 1272)`;
  set('cat_tail', 'transform', rot); set('tail_rim', 'transform', rot);
  const sk = 6 * Math.sin(t * 7.3) + 3 * Math.sin(t * 13.1 + 1);
  set('cat_flame', 'transform', `${rot} translate(995 1076) skewX(${sk.toFixed(3)}) scale(${(1 / Math.sqrt(fl)).toFixed(4)} ${fl.toFixed(4)}) translate(-995 -1076)`);
  for (const nm of ['L', 'R']) {
    set('cat_lid_' + nm, 'transform', `translate(0 ${-84 + 84 * cb})`);
    set('cat_lidlo_' + nm, 'transform', `translate(0 ${48 - 48 * cb})`);
  }
}
function only(name) { for (const L of LAYERS) $(L).style.display = (!name || L === name) ? '' : 'none'; }
