<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=2048, height=3072" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="lib/mesh_part.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 2048px; height: 3072px; overflow: hidden; background: #f7f3ea; }
      #root { position: relative; width: 2048px; height: 3072px; overflow: hidden; }
      .layer { position: absolute; left: 0; top: 0; width: 2048px; height: 3072px; }
      .abs { position: absolute; display: block; }
      svg.layer { overflow: visible; }
      #rays line { stroke: #18181a; stroke-linecap: round; }
    </style>
  </head>
  <body>
    <!-- Хук рилса 21 «Знаешь как, а не делаешь?»: мир сцены — рисунок k1_tips ×2, 2048×3072. Слои — anim/kit_tips.py,
         положение слоёв подставляет tips_hf.py из kit.json.
         С кадра 0 всё в движении: на кота сыплются листки-советы (каждый уже летит, качается и кружит), кот дрожит и
         вжимается каждый раз, когда листок пролетает у головы; на ударном «дЕлаешь» (data-vars.hit) сверху обрушивается
         вся пачка листков, кот приседает под ней и подскакивает, вокруг головы — штрихи испуга. Кружки на столике стоят
         не тронутые (фон). Камеру, звук и субтитры даёт сборщик. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="2.6" data-width="2048" data-height="3072"
         data-vars='{"hit": 1.3}' data-motion-blur="on" data-layout-allow-overflow data-layout-allow-overlap>
      <img id="bg" class="abs clip" src="assets/bg.png" style="left:0;top:0" data-start="0" data-duration="2.6" />
      <img id="page0" class="abs clip page" src="assets/page0.png" style="left:0px;top:0px" data-start="0" data-duration="2.6" />
      <img id="page1" class="abs clip page" src="assets/page1.png" style="left:0px;top:0px" data-start="0" data-duration="2.6" />
      <img id="page2" class="abs clip page" src="assets/page2.png" style="left:0px;top:0px" data-start="0" data-duration="2.6" />
      <img id="page3" class="abs clip page" src="assets/page3.png" style="left:0px;top:0px" data-start="0" data-duration="2.6" />
      <img id="page4" class="abs clip page" src="assets/page4.png" style="left:0px;top:0px" data-start="0" data-duration="2.6" />
      <img id="page5" class="abs clip page" src="assets/page5.png" style="left:0px;top:0px" data-start="0" data-duration="2.6" />
      <img id="page6" class="abs clip page" src="assets/page6.png" style="left:0px;top:0px" data-start="0" data-duration="2.6" />
      <img id="page7" class="abs clip page" src="assets/page7.png" style="left:0px;top:0px" data-start="0" data-duration="2.6" />
      <img id="page8" class="abs clip page" src="assets/page8.png" style="left:0px;top:0px" data-start="0" data-duration="2.6" />
      <img id="page9" class="abs clip page" src="assets/page9.png" style="left:0px;top:0px" data-start="0" data-duration="2.6" />
      <img id="page10" class="abs clip page" src="assets/page10.png" style="left:0px;top:0px" data-start="0" data-duration="2.6" />
      <img id="page11" class="abs clip page" src="assets/page11.png" style="left:0px;top:0px" data-start="0" data-duration="2.6" />
      <div id="cat" class="layer clip" data-start="0" data-duration="2.6">
        <div id="catHop" class="layer">
          <canvas id="tail" class="abs" width="840" height="1085" style="left:0px;top:0px"></canvas>
          <img id="body" class="abs" src="assets/body.png" style="left:0px;top:0px" />
        </div>
        <svg id="rays" class="layer" width="2048" height="3072" viewBox="0 0 2048 3072"></svg>
      </div>
    </div>
    <script>
      const root = document.getElementById("root");
      const V = JSON.parse(root.dataset.vars), H = V.hit, K = V.kit, N = 12;
      const NS = "http://www.w3.org/2000/svg";
      const tl = gsap.timeline({ paused: true });
      const px = (p) => `${p[0]}px ${p[1]}px`;
      gsap.set("#catHop", { transformOrigin: px(K.feet) });
      // кот: мелкая дрожь с кадра 0 (каждые 0,06 с в другую сторону) и вжимается на каждый пролетающий листок (0,32 с)
      const SH = 0.06;
      tl.fromTo("#catHop", { x: 16, y: -10, rotation: 1.8, scaleY: 0.97 }, { x: -14, y: 4, rotation: -1.4, scaleY: 1.0, duration: SH, ease: "none" }, 0);
      for (let i = 1, t = SH; t < H - 0.12; i++, t += SH) {
        const s = i % 2 ? 1 : -1, duck = Math.max(0, Math.cos((t / 0.32) * 2 * Math.PI)) ** 4;
        tl.to("#catHop", { x: s * (10 + 8 * duck), y: 26 * duck, rotation: s * (1.2 + 1.2 * duck),
                           scaleY: 1 - 0.07 * duck, scaleX: 1 + 0.03 * duck, duration: SH, ease: "none" }, t);
      }
      // «дЕлаешь»: пачка листков обрушивается — кот приседает, подскакивает, приземляется пружиной
      tl.to("#catHop", { x: 0, y: 46, rotation: 0, scaleY: 0.86, scaleX: 1.08, duration: 0.1, ease: "power3.in" }, H - 0.1);
      tl.to("#catHop", { y: -70, scaleY: 1.06, scaleX: 0.97, rotation: 2.5, duration: 0.15, ease: "power3.out" }, H + 0.02);
      tl.to("#catHop", { y: 0, scaleY: 1, scaleX: 1, rotation: 0, duration: 0.7, ease: "bounce.out" }, H + 0.17);
      // листки: каждый уже летит вниз с кадра 0 (без разгона), качается маятником и кружит; на ударе — обрушиваются
      for (let j = 0; j < N; j++) {
        const id = "#page" + j;
        gsap.set(id, { transformOrigin: "50% 50%" });
        const fall = 260 + 40 * (j % 4), sway = 60 + 14 * (j % 3), per = 0.34 + 0.05 * (j % 5), ph = (j * 0.37) % 1;
        const y0 = -fall * 0.55;
        tl.set(id, { y: y0, x: sway * Math.sin(ph * 6.28), rotation: 24 * Math.sin(ph * 6.28 + 1) }, 0);
        for (let t = 0, q = 0; t < H; t += per / 2, q++) {
          const tt = Math.min(H, t + per / 2), side = (q + j) % 2 ? 1 : -1;
          tl.to(id, { y: y0 + fall * (tt / H), x: side * sway, rotation: side * (20 + 6 * (j % 3)),
                      duration: tt - t, ease: "sine.inOut" }, t);
        }
        tl.to(id, { y: "+=" + (900 + 60 * (j % 5)), x: "+=" + ((j % 2 ? 1 : -1) * (120 + 30 * (j % 4))),
                    rotation: (j % 2 ? 1 : -1) * 200, duration: 0.45, ease: "power2.in" }, H - 0.06 + 0.015 * (j % 4));
      }
      // штрихи испуга по бокам головы на «дЕлаешь» — двумя веерами, как чёрточки рисунка
      const hx = K.head[0], hy = K.head[1];
      [-1, 1].forEach((side) => {
        for (let k = 0; k < 3; k++) {
          const a = (side < 0 ? Math.PI : 0) + side * (-0.55 + 0.42 * k) * -1;
          const g = document.createElementNS(NS, "g"), m = document.createElementNS(NS, "g"), l = document.createElementNS(NS, "line");
          g.setAttribute("transform", `translate(${hx + 560 * Math.cos(a)} ${hy - 260 + 300 * Math.sin(a)}) rotate(${(a * 180) / Math.PI})`);
          l.setAttribute("x1", 0); l.setAttribute("y1", 0); l.setAttribute("x2", 90); l.setAttribute("y2", 0); l.style.strokeWidth = 14;
          m.appendChild(l); g.appendChild(m); document.getElementById("rays").appendChild(g);
          tl.set(m, { opacity: 0, scaleX: 0, svgOrigin: "0 0" }, 0);
          tl.set(m, { opacity: 1 }, H + 0.03);
          tl.to(m, { scaleX: 1, duration: 0.07, ease: "power3.out" }, H + 0.03);
          tl.to(m, { x: 40, opacity: 0, duration: 0.3, ease: "power2.in" }, H + 0.22);
        }
      });
      meshPart({ canvas: document.getElementById("tail"), marg: 180, img: "assets/tail_body.png",
                 flame: "assets/tail_flame.png", mesh: "assets/tail_mesh.json", angles: "assets/tail_angles.json", fps: 30 });
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
