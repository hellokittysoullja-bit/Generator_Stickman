<!doctype html>
<html><head><meta charset="utf-8"><title>Рилс 26 — вечер, слои</title>
<style>html,body{margin:0;background:transparent}svg{display:block}</style></head>
<body>
<!--SVG-->
<script src="../timing26.js"></script>
<script>
// Вечерние планы рилса 26 (s05 s13 s17): торшер, огонёк — из ../timing26.js; поза, мимика, письмо, кот — по плану и t.
const TT = window.Timing26, $ = id => document.getElementById(id);
const set = (id, a, v) => { const e = $(id); if (e) e.setAttribute(a, v); };
const show = (id, on) => { const e = $(id); if (e) e.style.display = on ? '' : 'none'; };
const cl = x => Math.min(1, Math.max(0, x));
const ss = (a, b, x) => { const u = cl((x - a) / (b - a)); return u * u * (3 - 2 * u); };
const LAYERS = ['L_dima', 'L_plaid', 'L_cat', 'L_fx'];
// catLook(t) — зрачки кота; catBlinks — [начало, длительность]; tilt(t) — наклон головы, °
const SHOT = {
  s05: {dima: 1, pose: 'S0', look: 'book', rest: .3, blinks: [6.9], catBlinks: [[7.35, .26]],
        catLook: t => [-1.5 + 1.5 * ss(6.2, 6.5, t), .5],
        tilt: t => 12 * ss(TT.WHY - .04, TT.WHY + .26, t) - 2.5 * Math.max(0, Math.sin((t - TT.WHY - .26) * 5)) * Math.exp(-(t - TT.WHY - .26) * 4) * (t > TT.WHY + .26)},
  s13: {dima: 1, pose: 'S', look: 'book', rest: .26, blinks: [24.55], catBlinks: [[25.05, .24]],
        catLook: t => [-7 + 1 * Math.sin(t * 1.3), 4],
        tilt: t => 5 * ss(24.1, 24.5, t)},
  s17: {dima: 0, catBlinks: [[33.55, 1.05], [35.25, .9]],
        catLook: t => [-9 * (1 - ss(32.62, 32.9, t)), 4 * (1 - ss(32.62, 32.9, t))],
        tilt: t => -4 * ss(32.5, 32.95, t) + 3 * ss(34.7, 35.2, t), box: 1},
};
function blinkAt(t, list) {
  let v = 0;
  for (const b of list) { const d = t - b; if (d >= 0 && d < .08) v = Math.max(v, ss(0, .08, d)); else if (d >= .08 && d < .17) v = Math.max(v, 1 - ss(.08, .17, d)); }
  return v;
}
function catBlinkAt(t, list) {
  let v = 0;
  for (const [b, dur] of list) {
    const d = t - b, q = dur * .35;
    if (d < 0 || d > dur) continue;
    v = Math.max(v, d < q ? ss(0, q, d) : d < dur - q ? 1 : 1 - ss(dur - q, dur, d));
  }
  return v;
}
function mat(r, g, b) { return `${r * .9} ${r * .1} 0 0 0  ${g * .05} ${g * .9} ${g * .05} 0 0  0 ${b * .1} ${b * .9} 0 0  0 0 0 1 0`; }
// двухсуставная рука: кончик ручки в точку T; плечо S, локоть E, кончик P0 в покое
const ARM = {S: [452, 1078], E: [520, 1222], P: [384, 1212]};
function armIK(tx, ty) {
  const [Sx, Sy] = ARM.S, [Ex, Ey] = ARM.E, [Px, Py] = ARM.P;
  const L1 = Math.hypot(Ex - Sx, Ey - Sy), L2 = Math.hypot(Px - Ex, Py - Ey);
  let dx = tx - Sx, dy = ty - Sy, D = Math.hypot(dx, dy);
  D = Math.min(L1 + L2 - 1e-3, Math.max(Math.abs(L1 - L2) + 1e-3, D));
  const base = Math.atan2(dy, dx), a = Math.acos((L1 * L1 + D * D - L2 * L2) / (2 * L1 * D));
  const a0 = Math.atan2(Ey - Sy, Ex - Sx);
  // из двух решений — то, где локоть ближе к локтю покоя
  let best = null;
  for (const sg of [1, -1]) {
    const ang = base + sg * a, ex = Sx + L1 * Math.cos(ang), ey = Sy + L1 * Math.sin(ang);
    const d = Math.hypot(ex - Ex, ey - Ey);
    if (!best || d < best.d) best = {d, ang, ex, ey};
  }
  const r1 = best.ang - a0;
  const f0 = Math.atan2(Py - Ey, Px - Ex), f1 = Math.atan2(ty - best.ey, tx - best.ex);
  const deg = x => x * 180 / Math.PI;
  return [deg(r1), deg(f1 - f0 - r1)];
}
let CUR = 's13', SCR = null;
function scribAt(t) {   // [строка, доля, перо на бумаге]
  const R = [[23.86, 24.62], [24.74, 25.5]];
  for (let r = 0; r < 2; r++) {
    const [a, b] = R[r];
    if (t < a) return r === 0 ? [0, 0, 0] : [r - 1, 1, 0];
    if (t <= b) return [r, cl((t - a) / (b - a)), 1];
  }
  return [1, 1, 0];
}
function seek(t, shot) {
  if (shot) CUR = shot;
  const S = SHOT[CUR], fl = TT.flame(t, CUR), lamp = TT.lamp(t, CUR);
  if (!SCR) SCR = [0, 1].map(r => { const p = $('st_scrib' + r); return [p, p.getTotalLength()]; });
  const m = mat(0.66, 0.58, 0.56);
  set('fNightM', 'values', m);
  { const v = m.split(/\s+/).map(Number), c = [58, 54, 70];
    const rgb = [0, 1, 2].map(r => Math.round(v[r * 5] * c[0] + v[r * 5 + 1] * c[1] + v[r * 5 + 2] * c[2]));
    for (const e of document.querySelectorAll('.catlid')) e.setAttribute('fill', `rgb(${rgb.join(',')})`); }
  show('dima_all', !!S.dima);
  for (const p of ['L', 'P', 'N']) show('pose_' + p, false);
  show('pose_S', !!S.dima);
  show('box17', !!S.box);
  show('lap_screen_g', false); show('fx_pop', false); show('fx_cat', false);
  // письмо: строки проявляются за кончиком ручки, рука тянется кончиком к перу (IK), между строками перо приподнято
  if (S.dima) {
    let row = 0, w = 0, on = 0;
    if (S.pose === 'S') [row, w, on] = scribAt(t);
    for (let r = 0; r < 2; r++) {
      const [p, L] = SCR[r];
      const k = r < row ? 1 : r === row ? w : 0;
      set('st_scrib' + r, 'stroke-dasharray', `${L} ${L}`);
      set('st_scrib' + r, 'stroke-dashoffset', (L * (1 - k)).toFixed(2));
    }
    let tx, ty;
    if (S.pose === 'S') {
      const [p, L] = SCR[row];
      const q = p.getPointAtLength(L * Math.max(.001, w));
      tx = q.x + 1.6 * Math.sin(t * 2 * Math.PI * 7) * on; ty = q.y - (on ? 0 : 7) + 1.4 * Math.sin(t * 2 * Math.PI * 11 + 1) * on;
      // переход на вторую строку: перо идёт по воздуху от конца первой к началу второй
      if (t > 24.62 && t < 24.74) {
        const a = SCR[0][0].getPointAtLength(SCR[0][1]), b = SCR[1][0].getPointAtLength(.001), u = ss(24.62, 24.74, t);
        tx = a.x + (b.x - a.x) * u; ty = a.y + (b.y - a.y) * u - 9 * Math.sin(Math.PI * u);
      }
    } else { tx = ARM.P[0] + 6; ty = ARM.P[1] + 4 + .8 * Math.sin(t * 2 * Math.PI / 2.6); }
    const [r1, r2] = armIK(tx, ty);
    set('arm_up', 'transform', `rotate(${r1.toFixed(3)} ${ARM.S[0]} ${ARM.S[1]})`);
    set('arm_fore', 'transform', `rotate(${r2.toFixed(3)} ${ARM.E[0]} ${ARM.E[1]})`);
  }
  // голова и корпус Димы
  let hr = -5.5, hy = .8 * Math.sin(t * 2 * Math.PI / 2.6);
  if (CUR === 's13') hr += .8 * Math.sin(t * 2 * Math.PI * .9);
  const htf = `translate(0 ${hy.toFixed(2)}) rotate(${hr.toFixed(3)} 330 1010)`;
  for (const id of ['dima_head_pose', 'face_light_tv', 'face_light_lamp']) set(id, 'transform', htf);
  for (const id of ['dima_lean', 'lean_tv', 'lean_lamp']) set(id, 'transform', 'rotate(0.6 300 1300)');
  const bl = blinkAt(t, S.blinks || []);
  const lid = Math.max(bl, S.rest || 0) * 58;
  for (const nm of ['N', 'F']) set('dima_lid_' + nm, 'transform', `translate(0 ${lid.toFixed(2)})`);
  for (const nm of ['N', 'F']) set('dima_pupil_' + nm, 'transform', 'translate(4 7)');
  show('dima_eyes', true); show('dima_eyes_laugh', false);
  show('brows_tired', false); show('brows_up', false); show('brows_calm', true);
  const mouth = 'm_flat';
  for (const k of ['m_tired', 'm_tense', 'm_smile', 'm_open', 'm_chew', 'm_flat', 'm_warm', 'm_laugh']) show(k, k === mouth);
  show('dima_sweat', false);
  // свет
  set('tv_dima', 'opacity', 0); set('tv_plaid', 'opacity', 0); set('tv_cat', 'opacity', 0);
  set('lamp_dima', 'opacity', Math.min(1, .36 * lamp).toFixed(4));
  set('lamp_plaid', 'opacity', Math.min(1, .34 * lamp).toFixed(4));
  set('lamp_cat', 'opacity', Math.min(1, .5 * lamp).toFixed(4));
  set('fl_cat', 'opacity', Math.min(1, .72 * fl).toFixed(4)); set('fl_plaid', 'opacity', Math.min(1, .72 * fl).toFixed(4));
  // кот: наклон, взгляд, моргание, дыхание, хвост, огонёк
  const tilt = S.tilt ? S.tilt(t) : 0;
  const ttf = `rotate(${tilt.toFixed(3)} 836 1146)`;
  for (const id of ['cat_headg', 'cat_eyes_tilt', 'cat_head_rim', 'cat_head_rim_tv_cat', 'cat_head_rim_lamp_cat']) set(id, 'transform', ttf);
  const [cx_, cy_] = S.catLook ? S.catLook(t) : [0, 0];
  for (const nm of ['L', 'R']) set('cat_pupil_' + nm, 'transform', `translate(${cx_.toFixed(2)} ${cy_.toFixed(2)})`);
  const cb = catBlinkAt(t, S.catBlinks || []);
  for (const nm of ['L', 'R']) {
    set('cat_lid_' + nm, 'transform', `translate(0 ${(-84 + 84 * cb).toFixed(2)})`);
    set('cat_lidlo_' + nm, 'transform', `translate(0 ${(48 - 48 * cb).toFixed(2)})`);
    const shut = cb >= .9;
    show('cat_ring_' + nm, !shut); show('cat_eye_' + nm, !shut); show('cat_closed_' + nm, shut); show('cat_happy_' + nm, false);
  }
  show('cat_mouth_n', true); show('cat_mouth_h', false);
  const br = Math.sin(2 * Math.PI * t / 2.3);
  set('cat_jump', 'transform', `translate(812 1244) scale(${(1 + .004 * br).toFixed(5)} ${(1 + .010 * br).toFixed(5)}) translate(-812 -1244)`);
  const tail = 4 * Math.sin(2 * Math.PI * t / 2.2) + 1.5 * Math.sin(2 * Math.PI * t / 0.9 + 1);
  const rot = `rotate(${tail.toFixed(3)} 912 1272)`;
  set('cat_tail', 'transform', rot); set('tail_rim', 'transform', rot);
  const sk = 6 * Math.sin(t * 7.3) + 3 * Math.sin(t * 13.1 + 1), fs = Math.min(1.25, fl);
  set('cat_flame', 'transform', `${rot} translate(995 1076) skewX(${sk.toFixed(3)}) scale(${(1 / Math.sqrt(fs)).toFixed(4)} ${fs.toFixed(4)}) translate(-995 -1076)`);
}
function only(name) { for (const L of LAYERS) $(L).style.display = (!name || L === name) ? '' : 'none'; }
function setView(x, y, w, h, ow, oh) {
  const s = $('scene'); s.setAttribute('viewBox', `${x} ${y} ${w} ${h}`); s.setAttribute('width', ow); s.setAttribute('height', oh);
}
window.seek = seek; window.only = only; window.setView = setView;
seek(24.3, 's13');
</script>
</body></html>
