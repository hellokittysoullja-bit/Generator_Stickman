<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1728, height=2772" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="lib/mesh_part.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1728px; height: 2772px; overflow: hidden; background: #f7f3ea; }
      #root { position: relative; width: 1728px; height: 2772px; overflow: hidden; }
      .layer { position: absolute; left: 0; top: 0; width: 1728px; height: 2772px; }
      .abs { position: absolute; display: block; }
      .conf { position: absolute; width: 74px; height: 44px; background: #c2c0bb; border: 3px solid #1c1c1e; border-radius: 2px; }
      #fx { position: absolute; left: 0; top: 0; overflow: visible; }
      #fx line { stroke: #18181a; stroke-linecap: round; }
    </style>
  </head>
  <body>
    <!-- Хук рилса 12 (версия друга) «Все успели, а ты?»: мир сцены — рисунок k1_finish ×2 от (160, 300), 1728×2772.
         Слои — anim/kit_finish.py (база рилса 13), положение слоёв подставляет finish_hf.py из kit.json.
         Камеру, тряску, субтитры и звук даёт сборщик рилса. Время удара — ударный слог «ты́»: data-vars.hit. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="1.7" data-width="1728" data-height="2772"
         data-vars='{"hit": 1.23}' data-motion-blur="on" data-layout-allow-overflow data-layout-allow-overlap>
      <img id="bg" class="abs clip" src="assets/bg.png" style="left:0;top:0" data-start="0" data-duration="1.7" />
      <div id="sky" class="layer clip" data-start="0" data-duration="1.7">
        <img id="balloon" class="abs" src="assets/balloon.png" style="left:0px;top:0px" />
        <img id="people" class="abs" src="assets/people.png" style="left:0px;top:0px" />
        <img id="tape_l" class="abs" src="assets/tape_l.png" style="left:0px;top:0px" />
        <img id="tape_r" class="abs" src="assets/tape_r.png" style="left:0px;top:0px" />
        <div id="confetti"></div>
      </div>
      <div id="cat" class="layer clip" data-start="0" data-duration="1.7">
        <div id="catSlump" class="layer">
          <canvas id="tail" class="abs" width="699" height="867" style="left:0px;top:0px"></canvas>
          <img id="body" class="abs" src="assets/body.png" style="left:0px;top:0px" />
        </div>
        <img id="puff" class="abs" src="assets/puff.png" style="left:0px;top:0px" />
      </div>
      <svg id="fx" class="clip" width="1728" height="2772" viewBox="0 0 1728 2772" data-start="0" data-duration="1.7"><g id="rays"></g></svg>
    </div>
    <script>
      const root = document.getElementById("root");
      const V = JSON.parse(root.dataset.vars), H = V.hit;
      const K = V.kit;                                         // точки опоры из kit.json (подставляет finish_hf.py)
      const NS = "http://www.w3.org/2000/svg";
      const tl = gsap.timeline({ paused: true });
      const px = (p) => `${p[0]}px ${p[1]}px`;

      // шарик — последний с праздника — висит у верхнего края и чуть покачивается на нитке (шар над кадром:
      // уплывая вверх, он оставлял в кадре одну нитку — лист 02.11)
      gsap.set("#balloon", { transformOrigin: "50% 0%" });
      tl.fromTo("#balloon", { rotation: -2 }, { rotation: 2, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 2 }, 0);
      // трое уходят вдаль: меньше и выше, шаг вперевалку
      gsap.set("#people", { transformOrigin: "50% 100%" });
      tl.fromTo("#people", { scale: 1, y: 0 }, { scale: 0.9, y: -42, duration: 1.7, ease: "none" }, 0);
      tl.fromTo("#people", { rotation: -1.2 }, { rotation: 1.2, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 5 }, 0);
      // рваная финишная лента треплется у столбов: праздник кончился, а ветер остался
      gsap.set("#tape_l", { transformOrigin: px(K.tape_l_pivot) });
      gsap.set("#tape_r", { transformOrigin: px(K.tape_r_pivot) });
      tl.fromTo("#tape_l", { rotation: -3.2 }, { rotation: 2.2, duration: 0.42, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0);
      tl.fromTo("#tape_r", { rotation: 2.8 }, { rotation: -2.4, duration: 0.37, ease: "sine.inOut", yoyo: true, repeat: 4 }, 0);
      // запоздалое конфетти: падает, кружит, ложится и тает
      const CONF = [[400, -0.35, 1400, 1.6], [1380, -0.15, 1380, -1.2], [560, 0.25, 1260, 2.1], [1220, 0.6, 1260, -1.7],
                    [340, 0.9, 1420, 1.3], [1340, 1.15, 1400, -2.0]];
      CONF.forEach(([x, d, land, spin], i) => {
        const el = document.createElement("div"); el.className = "conf"; document.getElementById("confetti").appendChild(el);
        gsap.set(el, { left: x, top: 600, opacity: 0, rotation: 0 });
        const t0 = Math.max(0, d), pre = Math.max(0, -d);       // часть пути уже пройдена к кадру 0
        const fall = land - 600, dur = 1.1;
        tl.set(el, { opacity: 1, y: fall * (pre / dur) ** 2 }, t0);
        tl.to(el, { y: fall, duration: dur - pre, ease: "power2.in" }, t0);
        tl.fromTo(el, { rotation: 0 }, { rotation: 180 * spin, duration: dur - pre, ease: "none" }, t0);
        tl.fromTo(el, { scaleY: 1 }, { scaleY: 0.3, duration: 0.18, ease: "sine.inOut", yoyo: true, repeat: 5 }, t0);
        tl.to(el, { opacity: 0, duration: 0.25, ease: "power1.in" }, t0 + dur - pre - 0.25);
      });
      // кот: дышит; на ударном «ты́» сникает — оседает и чуть шире, пружиной, и так и остаётся сникшим
      gsap.set("#catSlump", { transformOrigin: px(K.cat_foot) });
      tl.fromTo("#catSlump", { scaleY: 1.0 }, { scaleY: 1.012, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);
      tl.to("#catSlump", { scaleY: 1.03, scaleX: 0.985, duration: H - 1.0, ease: "power2.out" }, 1.0);       // вдох перед ударом
      tl.to("#catSlump", { scaleY: 0.93, scaleX: 1.04, y: 6, duration: 0.07, ease: "power3.in" }, H);
      tl.to("#catSlump", { scaleY: 0.965, scaleX: 1.02, y: 3, duration: 0.42, ease: "elastic.out(1, 0.45)" }, H + 0.07);
      meshPart({ canvas: document.getElementById("tail"), marg: 180, img: "assets/tail_body.png",
                 flame: "assets/tail_flame.png", mesh: "assets/tail_mesh.json", angles: "assets/tail_angles.json", fps: 30 });
      // вздох: облачка и капли вырываются у морды после удара
      gsap.set("#puff", { transformOrigin: "20% 30%", opacity: 0, scale: 0.5 });
      tl.to("#puff", { opacity: 1, scale: 1, x: 18, y: -10, duration: 0.18, ease: "back.out(2.4)" }, H + 0.06);
      tl.to("#puff", { x: 60, y: -36, opacity: 0.0, duration: 0.3, ease: "power1.in" }, H + 0.36);
      // штрихи удара над головой — пером, вспыхивают и уходят наружу
      const HEAD = K.head;
      for (let i = 0; i < 5; i++) {
        const a = -Math.PI / 2 + (i - 2) * 0.42;
        const g = document.createElementNS(NS, "g"), m = document.createElementNS(NS, "g"), l = document.createElementNS(NS, "line");
        g.setAttribute("transform", `translate(${HEAD[0] + 200 * Math.cos(a)} ${HEAD[1] + 200 * Math.sin(a)}) rotate(${(a * 180) / Math.PI})`);
        l.setAttribute("x1", 0); l.setAttribute("y1", 0); l.setAttribute("x2", 70); l.setAttribute("y2", 0); l.style.strokeWidth = 12;
        m.appendChild(l); g.appendChild(m); document.getElementById("rays").appendChild(g);
        tl.set(m, { opacity: 0, scaleX: 0, svgOrigin: "0 0" }, 0);
        tl.set(m, { opacity: 1 }, H + 0.03);
        tl.to(m, { scaleX: 1, duration: 0.07, ease: "power3.out" }, H + 0.03);
        tl.to(m, { x: 50, opacity: 0, duration: 0.2, ease: "power2.in" }, H + 0.13);
      }
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
