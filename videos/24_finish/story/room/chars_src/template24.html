<!doctype html>
<html><head><meta charset="utf-8"><title>Рилс 24 — герои, слои</title>
<style>html,body{margin:0;background:transparent}svg{display:block}</style></head>
<body>
<!--SVG-->
<script src="../timing24.js"></script>
<script>
// Свет ноутбука, торшера и огонька, прыжок кота — из общей таблицы ../timing24.js (та же у сборки комнаты).
// Поза, мимика, хлопушка, блокнот, искры — по плану (shot) и общему времени ролика t.
const TT = window.Timing24, $ = id => document.getElementById(id);
const set = (id, a, v) => { const e = $(id); if (e) e.setAttribute(a, v); };
const show = (id, on) => { const e = $(id); if (e) e.style.display = on ? '' : 'none'; };
const cl = x => Math.min(1, Math.max(0, x));
const ss = (a, b, x) => { const u = cl((x - a) / (b - a)); return u * u * (3 - 2 * u); };
const LAYERS = ['L_dima', 'L_plaid', 'L_cat', 'L_fx'];
const h01 = (i, s) => { const v = Math.sin(i * 127.1 + s * 311.7) * 43758.5453123; return v - Math.floor(v); };
const SHOT = {
  s03: {pose: 'L', look: 'lap', mouth: 'm_flat', rest: .22, blinks: [3.18], catBlinks: [[2.9, .22]], catLook: [-5, 2]},
  s04: {pose: 'P', look: 'empty', mouth: 'm_flat', rest: .16, blinks: [3.72], catBlinks: []},
  s07: {pose: 'L', look: 'lap', mouth: 'm_flat', rest: .22, blinks: [], catBlinks: [[9.62, .22]], tilt: 1},
  s14: {pose: 'N', look: 'book', mouth: 'm_flat', rest: .3, blinks: [25.62], catBlinks: [[25.95, .24]], catLook: [-7, 1], open: 1, write: 1},
  s16: {pose: 'N', look: 'up', mouth: 'm_warm', rest: .38, blinks: [30.72], catBlinks: [[30.2, .26]], catLook: [-6, 0], lean: 1, done: 1},
  s17: {pose: 'N', look: 'up', mouth: 'm_laugh', laugh: 1, rest: .38, blinks: [], catBlinks: [], done: 1, jump: 1},
  s18: {pose: 'N', look: 'up', mouth: 'm_warm', rest: .38, blinks: [], catBlinks: [[34.55, 1.15]], done: 1, catSmile: 1},
};
function blinkAt(t, list) {
  let v = 0;
  for (const b of list) { const d = t - b; if (d >= 0 && d < .08) v = Math.max(v, ss(0, .08, d)); else if (d >= .08 && d < .17) v = Math.max(v, 1 - ss(.08, .17, d)); }
  return v;
}
function catBlinkAt(t, list) {
  let v = 0;
  for (const [b, dur] of list) {
    const d = t - b, q = dur * .35;
    if (d < 0 || d > dur) continue;
    v = Math.max(v, d < q ? ss(0, q, d) : d < dur - q ? 1 : 1 - ss(dur - q, dur, d));
  }
  return v;
}
function mat(r, g, b) { return `${r * .9} ${r * .1} 0 0 0  ${g * .05} ${g * .9} ${g * .05} 0 0  0 ${b * .1} ${b * .9} 0 0  0 0 0 1 0`; }
let CUR = 's03', SCRIB_L = 0, CHECK_L = 0;
function seek(t, shot) {
  if (shot) CUR = shot;
  const S = SHOT[CUR], tv = TT.tv(t), fl = TT.flame(t), lamp = TT.lamp(t), warm = TT.warm(t);
  if (!SCRIB_L) { SCRIB_L = $('nb_scrib').getTotalLength(); CHECK_L = $('nb_check').getTotalLength(); }
  // ночь (холодная) или вечер (тёплый, с «Радость» ещё теплее)
  let m;
  if (t < TT.EVENING) m = mat(0.52, 0.56, 0.86);
  else m = mat(0.66 + 0.08 * warm, 0.58 + 0.04 * warm, 0.56 - 0.04 * warm);
  set('fNightM', 'values', m);
  { // веки кота (поверх фильтра) — цвет шерсти после того же фильтра
    const v = m.split(/\s+/).map(Number), c = [58, 54, 70];
    const rgb = [0, 1, 2].map(r => Math.round(v[r * 5] * c[0] + v[r * 5 + 1] * c[1] + v[r * 5 + 2] * c[2]));
    for (const e of document.querySelectorAll('.catlid')) e.setAttribute('fill', `rgb(${rgb.join(',')})`);
  }
  // позы
  for (const p of ['L', 'P', 'N']) show('pose_' + p, S.pose === p);
  show('lap_screen_g', S.pose === 'L' || S.pose === 'P');
  // экран: вспышка и «поп» галочки на «получил»
  const fla = TT.flash(t);
  set('lap_flash', 'opacity', (0.8 * fla).toFixed(4));
  const pop = 1 + 0.35 * fla * (fla > 0 ? 1 : 0);
  set('lap_chk', 'transform', `translate(.72 .52) scale(${pop.toFixed(4)})`);
  // хлопушка: на «ноль» дёргается, «пуф» и две конфетти
  show('fx_pop', CUR === 's04');
  if (CUR === 's04') {
    const d = t - TT.ZERO;
    const kick = d >= 0 && d < .22 ? Math.sin(Math.PI * d / .22) : 0;
    set('popper', 'transform', `translate(${(1.5 * kick).toFixed(2)} ${(-5 * kick).toFixed(2)})`);
    const ang = -104 * Math.PI / 180, mx = 408 + 92 * Math.cos(ang) + 1.5 * kick, my = 1118 + 92 * Math.sin(ang) - 5 * kick;
    const pf = d < 0 ? 0 : d < .1 ? d / .1 : Math.max(0, 1 - (d - .1) / .3);
    set('pop_puff', 'transform', `translate(${mx.toFixed(2)} ${my.toFixed(2)}) rotate(-14) scale(${(0.001 + pf).toFixed(4)})`);
    for (let i = 0; i < 2; i++) {
      const vx = i ? 50 : 118, up = i ? 205 : 105;
      let x = mx, y = my - 6, rot = 0, sx = 1, sc = 0.001;
      if (d >= 0) {
        const u = Math.min(1, d / .32), e = 1 - Math.pow(1 - u, 2);
        const fall = Math.max(0, d - .32);
        x = mx + vx * e + 14 * Math.sin(fall * (i ? 7 : 9)) ;
        y = my - 6 - up * e + 95 * fall;
        rot = (i ? -1 : 1) * (40 + 260 * d);
        sx = Math.cos(d * (i ? 10 : 13));
        sc = Math.min(1, d / .05);
      }
      set('pop_c' + i, 'transform', `translate(${x.toFixed(2)} ${y.toFixed(2)}) rotate(${rot.toFixed(2)}) scale(${(sc * (Math.abs(sx) < .12 ? .12 * Math.sign(sx || 1) : sx)).toFixed(4)} ${sc.toFixed(4)})`);
    }
  }
  // блокнот: обложка открывается, строчка пишется, галочка
  if (S.pose === 'N') {
    const ci = S.open ? Math.round(14 * ss(24.85, 25.32, t)) : 14;
    for (let i = 0; i <= 14; i++) show('nb_cover' + i, i === ci);
    show('nb_left', ci > 7);
    let w = S.done ? 1 : S.write ? cl((t - 26.05) / 0.85) : 0;
    set('nb_scrib', 'stroke-dasharray', `${SCRIB_L} ${SCRIB_L}`);
    set('nb_scrib', 'stroke-dashoffset', (SCRIB_L * (1 - w)).toFixed(2));
    set('nb_check', 'stroke-dasharray', `${CHECK_L} ${CHECK_L}`);
    set('nb_check', 'stroke-dashoffset', (CHECK_L * (S.done ? 0 : 1)).toFixed(2));
    // рука с ручкой: кончик за концом строки, мелкая дрожь письма
    let hx = 0, hy = 0;
    if (S.write) {
      const reach = ss(25.55, 26.0, t);
      const p = $('nb_scrib').getPointAtLength(SCRIB_L * Math.max(0.001, w));
      const wig = w > 0 && w < 1 ? 1 : 0;
      hx = reach * (p.x - 384) + wig * 2.2 * Math.sin(t * 2 * Math.PI * 7);
      hy = reach * (p.y - 1212) + wig * 2.0 * Math.sin(t * 2 * Math.PI * 11 + 1);
    } else if (S.done) {
      const p = $('nb_scrib').getPointAtLength(SCRIB_L);
      hx = p.x - 384 + 16; hy = p.y - 1212 + 12;
    }
    set('pen_hand', 'transform', `translate(${hx.toFixed(2)} ${hy.toFixed(2)})`);
  }
  // голова и корпус
  let hr = 0, hy = 0, hx = 0, lean = 0;
  if (S.look === 'lap') hr = -4;
  if (S.look === 'book') hr = -5;
  if (S.lean) { lean = 1.2 * ss(29.3, 29.9, t) + 0.6; hr = 4 + 2 * ss(29.4, 30.0, t); }
  if (S.laugh) { hr = 5; hy = 3.2 * Math.sin(t * 2 * Math.PI * 4.2) * ss(31.45, 31.6, t); hx = 0; }
  if (CUR === 's04') hy = 0.8 * Math.sin(t * 2 * Math.PI / 2.4);    // дыхание
  if (S.look === 'book' || S.look === 'lap') hy += 0.8 * Math.sin(t * 2 * Math.PI / 2.6);
  const htf = `translate(${hx} ${hy.toFixed(2)}) rotate(${hr.toFixed(3)} 330 1010)`;
  for (const id of ['dima_head_pose', 'face_light_tv', 'face_light_lamp']) set(id, 'transform', htf);
  const ltf = `rotate(${lean.toFixed(3)} 300 1300)`;
  for (const id of ['dima_lean', 'lean_tv', 'lean_lamp']) set(id, 'transform', ltf);
  // глаза
  const bl = Math.max(blinkAt(t, S.blinks), CUR === 's04' ? catBlinkAt(t, [[3.70, .42]]) : 0);
  const lid = Math.max(bl, S.rest) * 58;
  for (const nm of ['N', 'F']) set('dima_lid_' + nm, 'transform', `translate(0 ${lid.toFixed(2)})`);
  let px = 0, py = 0;
  if (S.look === 'lap') { px = 7; py = 5; }
  if (S.look === 'book') { px = 4; py = 7; }
  if (S.look === 'empty') { px = -3; py = 3 + 0.6 * Math.sin(t * 1.3); }
  for (const nm of ['N', 'F']) set('dima_pupil_' + nm, 'transform', `translate(${px.toFixed(2)} ${py.toFixed(2)})`);
  show('dima_eyes', !S.laugh); show('dima_eyes_laugh', !!S.laugh);
  show('brows_tired', S.look === 'lap' || S.look === 'empty'); show('brows_up', false);
  show('brows_calm', !(S.look === 'lap' || S.look === 'empty'));
  for (const k of ['m_tired', 'm_tense', 'm_smile', 'm_open', 'm_chew', 'm_flat', 'm_warm', 'm_laugh']) show(k, k === S.mouth);
  show('dima_sweat', false);
  // свет
  set('tv_dima', 'opacity', Math.min(1, .42 * tv).toFixed(4));
  set('tv_plaid', 'opacity', Math.min(1, .40 * tv).toFixed(4));
  set('tv_cat', 'opacity', Math.min(1, .45 * tv).toFixed(4));
  set('lamp_dima', 'opacity', Math.min(1, .36 * lamp).toFixed(4));
  set('lamp_plaid', 'opacity', Math.min(1, .34 * lamp).toFixed(4));
  set('lamp_cat', 'opacity', Math.min(1, .5 * lamp).toFixed(4));
  set('fl_cat', 'opacity', Math.min(1, .72 * fl).toFixed(4)); set('fl_plaid', 'opacity', Math.min(1, .72 * fl).toFixed(4));
  // кот: наклон на «почему», моргания, взгляд, радость, прыжок, хвост, огонёк
  let tilt = 0;
  if (S.tilt) tilt = 11 * ss(TT.WHY - 0.06, TT.WHY + 0.24, t) * (1 - 0.35 * ss(9.9, 10.6, t));
  if (S.catSmile) tilt = -4 * ss(35.9, 36.6, t);
  const ttf = `rotate(${tilt.toFixed(3)} 836 1146)`;
  for (const id of ['cat_headg', 'cat_eyes_tilt', 'cat_head_rim', 'cat_head_rim_tv_cat', 'cat_head_rim_lamp_cat']) set(id, 'transform', ttf);
  const [cx_, cy_] = S.catLook || [0, 0];
  for (const nm of ['L', 'R']) set('cat_pupil_' + nm, 'transform', `translate(${cx_} ${cy_})`);
  const cb = catBlinkAt(t, S.catBlinks);
  const happy = S.jump ? ss(31.70, 31.84, t) : 0;
  const up = Math.max(cb, happy), lo = Math.max(cb, happy);
  for (const nm of ['L', 'R']) {
    set('cat_lid_' + nm, 'transform', `translate(0 ${(-84 + 84 * up).toFixed(2)})`);
    set('cat_lidlo_' + nm, 'transform', `translate(0 ${(48 - 48 * lo).toFixed(2)})`);
  }
  for (const nm of ['L', 'R']) {
    show('cat_ring_' + nm, up < .9);
    const hap = happy > .5, shut = !hap && up >= .9;
    show('cat_eye_' + nm, !hap && !shut); show('cat_closed_' + nm, shut); show('cat_happy_' + nm, hap);
  }
  const smile = happy > .5 || (S.catSmile && t > 35.5);
  show('cat_mouth_n', !smile); show('cat_mouth_h', smile);
  const [dy, sx, sy] = S.jump ? TT.cat_jump(t) : [0, 1, 1];
  set('cat_jump', 'transform', `translate(0 ${dy.toFixed(2)}) translate(812 1244) scale(${sx.toFixed(4)} ${sy.toFixed(4)}) translate(-812 -1244)`);
  const tail = (S.jump ? 7 : 4) * Math.sin(2 * Math.PI * t / (S.jump ? 0.9 : 2.2));
  const rot = `rotate(${tail.toFixed(3)} 912 1272)`;
  set('cat_tail', 'transform', rot); set('tail_rim', 'transform', rot);
  const sk = 6 * Math.sin(t * 7.3) + 3 * Math.sin(t * 13.1 + 1), fs = Math.min(S.jump ? 1.75 : 1.25, fl);
  set('cat_flame', 'transform', `${rot} translate(995 1076) skewX(${sk.toFixed(3)}) scale(${(1 / Math.sqrt(fs)).toFixed(4)} ${fs.toFixed(4)}) translate(-995 -1076)`);
  // искры и конфетти вокруг кота на «празднует»
  show('fx_cat', !!S.jump);
  if (S.jump) {
    const d = t - TT.CELEB;
    for (let i = 0; i < 9; i++) {
      const a = -Math.PI * (0.02 + 0.96 * i / 8) + 0.25 * (h01(i, 3) - .5), R0 = 80, R1 = 250 + 110 * h01(i, 5);
      const dd = d - 0.03 * (i % 3);
      let sc = 0.001, x = 812, y = 1060;
      if (dd > 0) {
        const u = 1 - Math.pow(1 - Math.min(1, dd / .55), 3);
        const r = R0 + (R1 - R0) * u;
        x = 812 + r * Math.cos(a); y = 1080 + 0.9 * r * Math.sin(a) + 30 * dd * dd;
        sc = (0.5 + 0.6 * h01(i, 7)) * Math.min(1, dd / .1) * (1 - ss(0.9, 1.5, dd)) * (1 + 0.18 * Math.sin(dd * 18 + i));
      }
      set('cs' + i, 'transform', `translate(${x.toFixed(2)} ${y.toFixed(2)}) rotate(${(30 * dd * (i % 2 ? 1 : -1)).toFixed(2)}) scale(${Math.max(0.001, sc).toFixed(4)})`);
    }
    for (let i = 0; i < 12; i++) {
      const dd = d - 0.02 * (i % 4);
      const vx = (h01(i, 11) - .5) * 900, vy = -(520 + 300 * h01(i, 13));
      const side = i % 2 ? 1 : -1, x0 = 812 + side * (70 + 40 * h01(i, 29)), y0 = 1150 - 60 * h01(i, 31);
      let x = x0, y = y0, sc = 0.001, rot = 0, fx = 1;
      if (dd > 0) {
        const tt = dd, drag = 1 - Math.exp(-tt * 2.2);
        x = x0 + side * Math.abs(vx) * drag / 2.2 + 18 * Math.sin(tt * (5 + 3 * h01(i, 17)) + i);
        y = y0 + vy * drag / 2.2 + 260 * tt * tt * 0.5 + 60 * Math.max(0, tt - .5);
        sc = Math.min(1, tt / .06); rot = (h01(i, 19) - .5) * 900 * tt; fx = Math.cos(tt * (8 + 6 * h01(i, 23)));
        if (Math.abs(fx) < .15) fx = .15 * Math.sign(fx || 1);
      }
      set('cc' + i, 'transform', `translate(${x.toFixed(2)} ${y.toFixed(2)}) rotate(${rot.toFixed(2)}) scale(${(sc * fx).toFixed(4)} ${sc.toFixed(4)})`);
    }
  }
}
function only(name) { for (const L of LAYERS) $(L).style.display = (!name || L === name) ? '' : 'none'; }
function setView(x, y, w, h, ow, oh) {
  const s = $('scene'); s.setAttribute('viewBox', `${x} ${y} ${w} ${h}`); s.setAttribute('width', ow); s.setAttribute('height', oh);
}
window.seek = seek; window.only = only; window.setView = setView;
seek(2.6, 's03');
</script>
</body></html>
