<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1664, height=2496" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1664px; height: 2496px; overflow: hidden; background: #f7f3ea; }
      #root { position: relative; width: 1664px; height: 2496px; overflow: hidden; }
      .layer { position: absolute; left: 0; top: 0; width: 1664px; height: 2496px; }
      .abs { position: absolute; display: block; }
    </style>
  </head>
  <body>
    <!-- Хук рилса 69 «Всем ответил, кроме одного?»: мир — рисунок g1_one_unread ×2 целиком, в половинном размере
         (координаты композиции = координаты исходника 1664×2496). Слои — anim/kit_unread.py, положение подставляет
         unread_hf.py из kit.json. С кадра 0 всё уже в движении: кот дрожит всем телом над телефоном (с хвостом),
         капля пота ползёт по лбу, красная точка непрочитанного пульсирует; на «одного» (data-vars.hit) точка
         вспыхивает втрое, кот отпрянул и пружиной вернулся. Камеру, тряску, субтитры и звук даёт сборщик. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="2.0" data-width="1664" data-height="2496"
         data-vars='{"hit": 1.08}' data-motion-blur="on" data-layout-allow-overflow data-layout-allow-overlap>
      <img id="bg" class="abs clip" src="assets/bg.png" style="left:0;top:0" data-start="0" data-duration="2.0" />
      <div id="all" class="layer clip" data-start="0" data-duration="2.0">
        <div id="catL" class="layer">
          <img id="cat" class="abs" src="assets/cat.png" style="left:0px;top:0px" />
          <div id="dropL" class="layer"><img id="drop" class="abs" src="assets/drop.png" style="left:0px;top:0px" /></div>
          <div id="dotL" class="layer"><img id="dot" class="abs" src="assets/dot.png" style="left:0px;top:0px" /></div>
        </div>
      </div>
    </div>
    <script>
      const root = document.getElementById("root");
      const V = JSON.parse(root.dataset.vars), H = V.hit, K = V.kit;
      const tl = gsap.timeline({ paused: true });
      const px = (p) => `${p[0]}px ${p[1]}px`;
      gsap.set("#catL", { transformOrigin: px(K.cat) });
      gsap.set("#dropL", { transformOrigin: px(K.drop) });
      gsap.set("#dotL", { transformOrigin: px(K.dot) });
      const S = 1 / 15;   // полупериод 2 кадра: крайние положения на границах кадров, ни один кадр не стоит
      // кот дрожит всем телом с кадра 0 (в кадре 0 уже на ходу): мелкая нервная дрожь влево-вправо с наклоном
      tl.fromTo("#catL", { x: -16, y: -4, rotation: -1.3 }, { x: 15, y: 3, rotation: 1.2, duration: S, ease: "none" }, 0);
      let t = S, i = 0;
      while (t < H - 0.06) {
        const r = i % 2 === 0;
        tl.to("#catL", { x: r ? -16 + 4 * (i % 3) : 15 - 3 * (i % 3), y: r ? -4 : 3, rotation: r ? -1.3 : 1.2,
                         duration: S, ease: "none" }, t);
        t += S; i++;
      }
      // капля пота ползёт по лбу вниз и растёт
      tl.fromTo("#dropL", { y: -10, scale: 0.9 }, { y: 150, scale: 1.25, duration: H, ease: "none" }, 0);
      // красная точка пульсирует
      const D = 0.1;
      tl.fromTo("#dotL", { scale: 1.7 }, { scale: 1.0, duration: D, ease: "none" }, 0);
      for (let k = 1; D * k < H - 0.04; k++) {
        tl.to("#dotL", { scale: k % 2 ? 1.7 : 1.0, duration: D, ease: "none" }, D * k);
      }
      // «одного»: точка вспыхивает втрое и остаётся крупной, пульсируя
      tl.to("#dotL", { scale: 3.4, duration: 0.07, ease: "power3.out" }, H - 0.03);
      tl.to("#dotL", { scale: 2.2, duration: 0.5, ease: "elastic.out(1, 0.35)" }, H + 0.06);
      // кот отпрянул назад и вверх и пружиной вернулся
      tl.to("#catL", { x: -40, y: -46, rotation: -3.5, duration: 0.07, ease: "power3.out" }, H - 0.03);
      tl.to("#catL", { x: 0, y: 0, rotation: 0, duration: 0.8, ease: "elastic.out(1, 0.35)" }, H + 0.06);
      // капля слетает со лба
      tl.to("#dropL", { x: 180, y: 60, scale: 0.6, opacity: 0, duration: 0.3, ease: "power2.out" }, H);
      function DURATION() { return 2.0; }
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
