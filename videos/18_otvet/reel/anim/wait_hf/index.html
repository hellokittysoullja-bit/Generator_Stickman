<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=2048, height=2900" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="lib/mesh_part.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 2048px; height: 2900px; overflow: hidden; background: #f7f3ea; }
      #root { position: relative; width: 2048px; height: 2900px; overflow: hidden; }
      .layer { position: absolute; left: 0; top: 0; width: 2048px; height: 2900px; }
      .abs { position: absolute; display: block; }
      svg.layer { overflow: visible; }
      #rays line { stroke: #18181a; stroke-linecap: round; }
    </style>
  </head>
  <body>
    <!-- Хук рилса 18 «Ответить другу секунда, а ты не отвечаешь неделю?»: мир сцены — рисунок a1_wait ×2 от (0, 100),
         2048×2900. Слои — anim/kit_wait.py, положение слоёв подставляет wait_hf.py из kit.json.
         С кадра 0 всё в движении: телефон в лапах вибрирует, кот трясётся мелкой дрожью и вжимается, облачко сообщения
         пульсирует и качается, листки календаря летят и кружат; на ударном «нЕделю» (data-vars.hit) кот вздрагивает и
         подскакивает, облачко раздувается, листки разлетаются, вокруг головы штрихи. Камеру, звук и субтитры даёт сборщик. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="3.6" data-width="2048" data-height="2900"
         data-vars='{"hit": 2.8}' data-motion-blur="on" data-layout-allow-overflow data-layout-allow-overlap>
      <img id="bg" class="abs clip" src="assets/bg.png" style="left:0;top:0" data-start="0" data-duration="3.6" />
      <img id="page0" class="abs clip" src="assets/page0.png" style="left:0px;top:0px" data-start="0" data-duration="3.6" />
      <img id="page1" class="abs clip" src="assets/page1.png" style="left:0px;top:0px" data-start="0" data-duration="3.6" />
      <img id="page2" class="abs clip" src="assets/page2.png" style="left:0px;top:0px" data-start="0" data-duration="3.6" />
      <img id="page3" class="abs clip" src="assets/page3.png" style="left:0px;top:0px" data-start="0" data-duration="3.6" />
      <img id="bubble" class="abs clip" src="assets/bubble.png" style="left:0px;top:0px" data-start="0" data-duration="3.6" />
      <div id="cat" class="layer clip" data-start="0" data-duration="3.6">
        <div id="catHop" class="layer">
          <canvas id="tail" class="abs" width="941" height="1348" style="left:0px;top:0px"></canvas>
          <img id="body" class="abs" src="assets/body.png" style="left:0px;top:0px" />
        </div>
        <svg id="rays" class="layer" width="2048" height="2900" viewBox="0 0 2048 2900"></svg>
      </div>
    </div>
    <script>
      const root = document.getElementById("root");
      const V = JSON.parse(root.dataset.vars), H = V.hit, K = V.kit;
      const NS = "http://www.w3.org/2000/svg";
      const tl = gsap.timeline({ paused: true });
      const px = (p) => `${p[0]}px ${p[1]}px`;
      gsap.set("#catHop", { transformOrigin: px(K.feet) });
      // вибрация телефона: кот трясётся рывками с кадра 0 (без разгона), каждые 0,05 с в другую сторону,
      // и волнами вжимается и выпрямляется (виноватая дрожь)
      const SH = 0.05;
      tl.fromTo("#catHop", { x: -22, y: -26, rotation: -2.6, scaleY: 1.03 }, { x: 18, y: 6, rotation: 1.8, scaleY: 0.98, duration: SH, ease: "none" }, 0);
      for (let i = 1, t = SH; t < H - 0.1; i++, t += SH) {
        const s = i % 2 ? -1 : 1, w = Math.sin(t * 7.5);
        tl.to("#catHop", { x: s * (14 + 6 * Math.abs(w)), y: -14 * Math.abs(w), rotation: s * (1.6 + 0.8 * Math.abs(w)),
                           scaleY: 1 - 0.03 * w, duration: SH, ease: "none" }, t);
      }
      // «нЕделю»: кот вздрагивает — присел, подскок, приземление пружиной
      tl.to("#catHop", { x: 0, y: 30, rotation: 0, scaleY: 0.9, scaleX: 1.06, duration: 0.08, ease: "power3.in" }, H - 0.08);
      tl.to("#catHop", { y: -120, scaleY: 1.08, scaleX: 0.96, rotation: -3, duration: 0.16, ease: "power3.out" }, H);
      tl.to("#catHop", { y: 0, scaleY: 1, scaleX: 1, rotation: 0, duration: 0.8, ease: "bounce.out" }, H + 0.16);
      // облачко: пульсирует и качается, как пульсирует непрочитанное
      gsap.set("#bubble", { transformOrigin: "50% 100%" });
      tl.fromTo("#bubble", { scale: 0.88, rotation: -5 }, { scale: 1.08, rotation: 4, duration: 0.12, ease: "none" }, 0);
      for (let i = 1, t = 0.12; t < H - 0.1; i++, t += 0.12) {
        tl.to("#bubble", { scale: i % 2 ? 0.9 : 1.08, rotation: i % 2 ? -4 : 4, y: i % 2 ? 10 : -16, duration: 0.12, ease: "sine.inOut" }, t);
      }
      tl.to("#bubble", { scale: 1.35, rotation: 0, y: -60, duration: 0.14, ease: "back.out(3)" }, H);
      tl.to("#bubble", { scale: 1.12, duration: 0.5, ease: "elastic.out(1, 0.4)" }, H + 0.14);
      // листки: с кадра 0 летят вправо-вниз и кружат, каждый в своей фазе; на ударе — разлетаются
      ["#page0", "#page1", "#page2", "#page3"].forEach((id, j) => {
        gsap.set(id, { transformOrigin: "50% 50%" });
        const per = 0.26 + 0.04 * j, dx = 70 + 18 * j, dy = 34 + 10 * j;
        tl.fromTo(id, { x: -dx, y: -dy, rotation: (j % 2 ? 1 : -1) * 22 }, { x: 0, y: 0, rotation: (j % 2 ? -1 : 1) * 12, duration: per / 2, ease: "none" }, 0);
        let q = 1;
        for (let t = per / 2; t < H; t += per / 2, q++) {
          tl.to(id, { x: q * dx * 0.55, y: q * dy * 0.45 + (q % 2 ? -26 : 26), rotation: ((q + j) % 2 ? -1 : 1) * 24,
                      duration: per / 2, ease: "sine.inOut" }, t);
        }
        tl.to(id, { x: "+=" + (420 + 90 * j), y: "+=" + (380 - 60 * j), rotation: (j % 2 ? 1 : -1) * 260, opacity: 0,
                    duration: 0.6, ease: "power2.out" }, H + 0.02 * j);
      });
      // штрихи вздрагивания вокруг головы на «нЕделю»
      const hx = K.head[0], hy = K.head[1];
      for (let k = 0; k < 7; k++) {
        const a = -Math.PI / 2 + (k - 3) * 0.42;
        const g = document.createElementNS(NS, "g"), m = document.createElementNS(NS, "g"), l = document.createElementNS(NS, "line");
        g.setAttribute("transform", `translate(${hx + 650 * Math.cos(a)} ${hy + 380 * Math.sin(a)}) rotate(${(a * 180) / Math.PI})`);
        l.setAttribute("x1", 0); l.setAttribute("y1", 0); l.setAttribute("x2", 80); l.setAttribute("y2", 0); l.style.strokeWidth = 13;
        m.appendChild(l); g.appendChild(m); document.getElementById("rays").appendChild(g);
        tl.set(m, { opacity: 0, scaleX: 0, svgOrigin: "0 0" }, 0);
        tl.set(m, { opacity: 1 }, H + 0.02);
        tl.to(m, { scaleX: 1, duration: 0.07, ease: "power3.out" }, H + 0.02);
        tl.to(m, { x: 50, opacity: 0, duration: 0.26, ease: "power2.in" }, H + 0.18);
      }
      meshPart({ canvas: document.getElementById("tail"), marg: 180, img: "assets/tail_body.png",
                 flame: "assets/tail_flame.png", mesh: "assets/tail_mesh.json", angles: "assets/tail_angles.json", fps: 30 });
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
